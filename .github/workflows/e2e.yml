name: E2E

# Hits the deployed worker, so it is not tied to a push: a commit's own code is
# already checked against workerd by CI, and running this per push would report
# whatever is currently deployed as that commit's failure.
#
# The daily run is the only thing that ever looks at the live worker again after
# its deploy. Nothing else would notice it drifting from what the repository
# says — a hand-run deploy from another ref, a runtime change underneath it, or
# the worker simply no longer being there.
on:
  schedule:
    # 06:37, off the hour because minute 0 is congested and delayed
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Worker origin to hit. Defaults to the deployment in scripts/e2e.ts.
        required: false
        type: string

jobs:
  e2e:
    name: Hit the deployed worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the deployed worker against the fixtures
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: pnpm e2e
